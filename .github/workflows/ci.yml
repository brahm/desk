name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Format, lint and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install GTK, Libadwaita, the test fonts and Poppler
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libgtk-4-dev libadwaita-1-dev fonts-liberation poppler-utils
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path fuzz/Cargo.toml --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- --deny warnings
      - name: Run tests
        run: cargo test --workspace --locked
      - name: Build the documentation
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: --deny warnings
      - name: Check dependency rules
        run: ci/check-deps.sh
      - name: Compare the corpus with Pages
        run: cargo run --locked --package desk-testkit --bin desk-parity
      - name: Keep the parity report and the diff images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-report
          path: target/parity
          if-no-files-found: ignore

  msrv:
    name: Build with the minimum Rust version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install GTK and Libadwaita
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libgtk-4-dev libadwaita-1-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          # Keep in sync with rust-version in Cargo.toml.
          toolchain: "1.92"
      - uses: Swatinem/rust-cache@v2
      - name: Check the workspace
        run: cargo check --workspace --all-targets --locked

  odf:
    name: Validate the ODF that Desk writes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install GTK, Libadwaita, the test fonts and Jing
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libgtk-4-dev libadwaita-1-dev fonts-liberation jing unzip
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: target/odf-schema
          key: odf-schema-${{ hashFiles('ci/validate-odf.sh') }}
      - name: Validate against the ODF 1.3 schemas
        run: ci/validate-odf.sh

  fuzz:
    name: Fuzz the readers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Cairo, GLib, FreeType and Fontconfig
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libcairo2-dev libglib2.0-dev libfreetype-dev libfontconfig-dev
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo install --locked cargo-fuzz
      - name: Run each target for two minutes
        run: ci/fuzz.sh 120
      - name: Keep the failing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore

  deny:
    name: Licenses and advisories of dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: fsfe/reuse-action@v5

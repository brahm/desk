name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned by commit, with the tag they were taken from beside
# them, so that a tag moved upstream does not change what runs here
# (review RV, batch 6); Dependabot proposes the updates.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  DEBIAN_FRONTEND: noninteractive

# The jobs that build the apps run in Ubuntu 26.10, whose GTK 4.24 and
# Libadwaita 1.10 are those of the GNOME 51 runtime that the Flatpak of
# Desk uses. The container runs as root, so apt-get needs no sudo, and it
# starts bare, so the first step installs what the others need.

jobs:
  rust:
    name: Format, lint and test
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:26.10
    steps:
      - name: Install GTK, Libadwaita, the test fonts, Poppler and a display
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends curl ca-certificates git build-essential pkg-config libgtk-4-dev libadwaita-1-dev libpoppler-glib-dev fonts-liberation fonts-texgyre fonts-urw-base35 fonts-crosextra-carlito fonts-crosextra-caladea poppler-utils hunspell-en-us hunspell-pt-br hyphen-en-us hyphen-pt-br xvfb xauth
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Check formatting
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path fuzz/Cargo.toml --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- --deny warnings
      # Under a virtual display, so that the tests of windows, editors and
      # the clipboard run rather than skip (review RV, batch 6, B-062).
      - name: Run tests
        run: xvfb-run --auto-servernum cargo test --workspace --locked
      - name: Build the documentation
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: --deny warnings
      - name: Check dependency rules
        run: ci/check-deps.sh
      - name: Compare the corpus with Pages
        run: cargo run --locked --package desk-testkit --bin desk-parity -- --check-readme
      - name: Keep the parity report and the diff images
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: parity-report
          path: target/parity
          if-no-files-found: ignore

  msrv:
    name: Build with the minimum Rust version
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:26.10
    steps:
      - name: Install GTK and Libadwaita
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends curl ca-certificates git build-essential pkg-config libgtk-4-dev libadwaita-1-dev libpoppler-glib-dev
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          # Keep in sync with rust-version in Cargo.toml.
          toolchain: "1.98"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Check the workspace
        run: cargo check --workspace --all-targets --locked

  odf:
    name: Validate the ODF that Desk writes
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:26.10
    steps:
      - name: Install GTK, Libadwaita, the test fonts and Jing
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends curl ca-certificates git build-essential pkg-config libgtk-4-dev libadwaita-1-dev libpoppler-glib-dev fonts-liberation jing unzip
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target/odf-schema
          key: odf-schema-${{ hashFiles('ci/validate-odf.sh') }}
      - name: Check that every desk extension is defined
        run: python3 ci/check-extensions.py
      - name: Validate against the ODF 1.3 schemas
        run: ci/validate-odf.sh

  ui:
    name: UI tests through the accessibility tree
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:26.10
    steps:
      - name: Install GTK, Libadwaita, a display and AT-SPI
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends curl ca-certificates git build-essential pkg-config libgtk-4-dev libadwaita-1-dev libpoppler-glib-dev fonts-liberation xvfb xauth xdotool dbus libglib2.0-bin at-spi2-core python3-gi gir1.2-atspi-2.0 hunspell-en-us gstreamer1.0-plugins-good gstreamer1.0-libav
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Drive Desk Writer as a screen reader sees it
        run: ci/ui-test.sh

  translations:
    name: Translations and desktop files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install the gettext tools and the desktop file validators
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gettext desktop-file-utils appstream
      - name: Check that every string is in the template and the catalogs build
        run: ci/update-translations.sh --check
      - name: Validate the desktop files and the AppStream metadata
        run: |
          desktop-file-validate data/*.desktop
          appstreamcli validate --no-net --pedantic data/*.metainfo.xml

  fuzz:
    name: Fuzz the readers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Cairo, GLib, FreeType and Fontconfig
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libcairo2-dev libglib2.0-dev libfreetype-dev libfontconfig-dev libpoppler-glib-dev
      - uses: dtolnay/rust-toolchain@6a52aad76a94a5fbc50d567bb5be24419801c1fb # nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo install --locked cargo-fuzz
      - name: Run each target for two minutes
        run: ci/fuzz.sh 120
      - name: Keep the failing inputs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore

  backlog:
    name: Backlog register and notes in the code
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check the register and that every note in the code cites an open row
        run: python3 ci/check-backlog.py

  flatpak-sources:
    name: Crates of the Flatpak build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check that the Flatpak build vendors the crates of Cargo.lock
        run: python3 ci/flatpak-cargo-sources.py --check

  deny:
    name: Licenses and advisories of dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2
  reuse:
    name: REUSE compliance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: fsfe/reuse-action@bb774aa972c2a89ff34781233d275075cbddf542 # v5
name: Website

on:
  push:
    branches: [main]
    paths:
      - site/**
      - data/logo/**
      - data/icons/hicolor/scalable/apps/**
      - ci/build-site.sh
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - site/**
      - data/logo/**
      - data/icons/hicolor/scalable/apps/**
      - ci/build-site.sh
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and never cancel one that has started.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the website
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Assemble the site
        run: ci/build-site.sh _site
      # The Flatpak repository joins the site: the Flatpak workflow keeps
      # the signed OSTree repository, its key and the .flatpakrepo and
      # .flatpakref files as an asset of the "flatpak-repo" release.
      - name: Add the Flatpak repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download flatpak-repo --repo "$GITHUB_REPOSITORY" --pattern flatpak-repo.tar --dir "$RUNNER_TEMP"; then
            tar -xf "$RUNNER_TEMP/flatpak-repo.tar" -C _site
            ls _site
          else
            echo "No Flatpak repository published yet"
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Publish on GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  install:
    name: Install the beta from the published repository
    needs: deploy
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - name: Install Desk Writer from desk.flatpakrepo
        run: |
          site=https://brahm.github.io/desk
          if ! curl -fsS -o /dev/null "$site/desk.flatpakrepo"; then
            echo "No Flatpak repository published yet"
            exit 0
          fi
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak remote-add --user --if-not-exists desk "$site/desk.flatpakrepo"
          flatpak remote-ls --user desk
          for branch in beta nightly; do
            if flatpak remote-info --user desk br.com.brahm.Desk.Writer//$branch >/dev/null 2>&1; then
              flatpak install --user --noninteractive --assumeyes desk br.com.brahm.Desk.Writer//$branch
              flatpak run --user --command=sh br.com.brahm.Desk.Writer//$branch -c 'test -x /app/bin/desk-writer'
            fi
          done

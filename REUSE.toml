version = 1

# Default for every file without an SPDX header of its own: the
# applications and the rest of the repository are GPL-3.0-or-later.
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 Desk contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# The file format libraries are MPL-2.0, so that other programs can use
# them to read and write the same formats. The last matching table wins.
[[annotations]]
path = ["crates/desk-odf/**", "crates/desk-iwork/**", "crates/desk-formula/**"]
SPDX-FileCopyrightText = "2026 Desk contributors"
SPDX-License-Identifier = "MPL-2.0"

# Test fonts derived from the Liberation fonts, under their license.
[[annotations]]
path = "corpus/fixtures/fonts/*.ttf"
SPDX-FileCopyrightText = ["Digitized data copyright (c) 2010 Google Corporation", "2012 Red Hat, Inc.", "2026 Desk contributors"]
SPDX-License-Identifier = "OFL-1.1"

# Desk Neue, derived from TeX Gyre Heros under its license, the GUST Font
# License, an instance of the LaTeX Project Public License 1.3c.
[[annotations]]
path = "data/fonts/desk-neue/*.otf"
SPDX-FileCopyrightText = ["2007-2009 B. Jackowski and J.M. Nowacki (on behalf of TeX Users Groups), for TeX Gyre", "2026 Desk contributors"]
SPDX-License-Identifier = "LPPL-1.3c"

# The fonts that stand for those of the Pages templates, made by
# data/fonts/make-substitutes.py from fonts under the SIL Open Font
# License, each with the license text of its source.
[[annotations]]
path = ["data/fonts/desk-humanist/*.ttf", "data/fonts/desk-humanist/OFL.txt"]
SPDX-FileCopyrightText = ["2018 The Cabin Project Authors (https://github.com/impallari/Cabin.git), for Cabin", "2026 Desk contributors"]
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["data/fonts/desk-flare/*.ttf", "data/fonts/desk-flare/OFL.txt"]
SPDX-FileCopyrightText = ["2010-2014 tyPoland Lukasz Dziedzic (team@latofonts.com), with Reserved Font Name \"Lato\", for Lato", "2026 Desk contributors"]
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["data/fonts/desk-geometric/*.ttf", "data/fonts/desk-geometric/OFL.txt"]
SPDX-FileCopyrightText = ["2020 The Jost Project Authors (https://github.com/indestructible-type), for Jost", "2026 Desk contributors"]
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]

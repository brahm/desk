SPDX-FileCopyrightText = ["2018 The Baskervville Project Authors (https://github.com/anrt-type/ANRT-Baskervville), for Baskervville", "2026 Desk contributors"]
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["data/fonts/desk-oldstyle/*.ttf", "data/fonts/desk-oldstyle/OFL.txt"]
SPDX-FileCopyrightText = ["2017 The EB Garamond Project Authors (https://github.com/octaviopardo/EBGaramond12), for EB Garamond", "2026 Desk contributors"]
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]

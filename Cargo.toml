[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
# The format libraries (desk-odf, desk-iwork and desk-formula) set
# MPL-2.0 in their own manifests.
license = "GPL-3.0-or-later"
repository = "https://github.com/brahm/desk"
publish = false

[workspace.dependencies]
# Only desk-ui uses these, and the apps reach them through its re-exports.
# Desk is distributed only as a Flatpak on the GNOME 51 runtime, so the
# features ask for what that runtime has: GTK 4.24 and Libadwaita 1.10.
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_10"] }
gtk = { package = "gtk4", version = "0.11.5", features = ["gnome_50", "v4_24"] }
# Builds the app icons into desk-ui as GResources. It runs the
# glib-compile-resources tool, which comes with the GLib development files.
glib-build-tools = "0.22.8"

# Persistent collections for the document model, so that snapshots are cheap.
imbl = "7.0.2"
proptest = "1.12.0"
unicode-segmentation = "1.13.3"

# Spelling with the Hunspell dictionaries of the system, in desk-lang.
spellbook = "0.4.2"
# The encodings of the dictionaries that are not in UTF-8, by their SET line.
encoding_rs = "0.8.35"

# Text layout, as decided by the proof of concept in experiments/text-engine.
# icu_segmenter and skrifa are pinned to the versions Parley itself uses.
icu_segmenter = "2.4.0"
parley = "0.12.0"
skrifa = "0.44.0"

# Drawing and PDF output in desk-render. Cairo 1.16 is needed for PDF
# metadata; FreeType hands Cairo the fonts that Parley chose. The default
# use_glib feature stays on: without it, cloning a Cairo object does not
# take a reference, and the object is freed twice.
cairo-rs = { version = "0.22.9", features = ["freetype", "pdf", "png", "v1_16"] }
freetype-rs = "0.38.0"

# The corpus cases and the parity report of desk-testkit.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"

# The format libraries: zip packages and XML streams.
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
quick-xml = "0.42.0"
zip = { version = "9.2.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# The pictures of image bullets, which the model keeps as PNG; Pages saves
# them as TIFF.
png = "0.18.1"
tiff = { version = "0.11.3", default-features = false, features = ["deflate", "lzw"] }
# The images of documents: JPEG as it came, GIF as PNG, and PDF drawn as
# it is by Poppler, which comes with GNOME.
gif = { version = "0.14.2", default-features = false, features = ["std"] }
glib = "0.22.10"
poppler-rs = { version = "0.26.0", features = ["v0_82"] }
zune-jpeg = "0.5.15"

desk-anim = { path = "crates/desk-anim" }
desk-chart = { path = "crates/desk-chart" }
desk-contacts = { path = "crates/desk-contacts" }
desk-filters = { path = "crates/desk-filters" }
desk-formula = { path = "crates/desk-formula" }
desk-iwork = { path = "crates/desk-iwork" }
desk-lang = { path = "crates/desk-lang" }
desk-layout = { path = "crates/desk-layout" }
desk-model = { path = "crates/desk-model" }
desk-odf = { path = "crates/desk-odf" }
desk-render = { path = "crates/desk-render" }
desk-table = { path = "crates/desk-table" }
desk-testkit = { path = "crates/desk-testkit" }
desk-text = { path = "crates/desk-text" }
desk-ui = { path = "crates/desk-ui" }

[workspace.lints.rust]
missing_docs = "warn"
# Unsafe code is allowed only at the boundaries with C libraries, with a
# local #[allow(unsafe_code)]. The format libraries forbid it outright.
unsafe_code = "deny"

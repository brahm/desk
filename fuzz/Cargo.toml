# Fuzz targets for the readers of untrusted files. They build with
# cargo-fuzz on a nightly toolchain, so this crate stays out of the
# workspace; ci/fuzz.sh runs them.

[package]
name = "desk-fuzz"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.10"
desk-filters = { path = "../crates/desk-filters" }
desk-odf = { path = "../crates/desk-odf" }
desk-model = { path = "../crates/desk-model" }
desk-formula = { path = "../crates/desk-formula" }
desk-table = { path = "../crates/desk-table" }
desk-math = { path = "../crates/desk-math" }
desk-contacts = { path = "../crates/desk-contacts" }

# Not part of the main workspace.
[workspace]

[profile.release]
debug = 1

[[bin]]
name = "odt_streams"
path = "fuzz_targets/odt_streams.rs"
test = false
doc = false
bench = false

[[bin]]
name = "odt_package"
path = "fuzz_targets/odt_package.rs"
test = false
doc = false
bench = false

[[bin]]
name = "odt_import"
path = "fuzz_targets/odt_import.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pages_import"
path = "fuzz_targets/pages_import.rs"
test = false
doc = false
bench = false

[[bin]]
name = "html_paste"
path = "fuzz_targets/html_paste.rs"
test = false
doc = false
bench = false

[[bin]]
name = "formula_parse"
path = "fuzz_targets/formula_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "picture"
path = "fuzz_targets/picture.rs"
test = false
doc = false
bench = false

[[bin]]
name = "equation"
path = "fuzz_targets/equation.rs"
test = false
doc = false
bench = false

[[bin]]
name = "merge_source"
path = "fuzz_targets/merge_source.rs"
test = false
doc = false
bench = false

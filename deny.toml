# Configuration of cargo-deny, which the CI runs on every change.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Fail on dependencies with known vulnerabilities or that were yanked.
yanked = "deny"

[licenses]
# Licenses that may be combined with both GPL-3.0-or-later (the apps) and
# MPL-2.0 (the format libraries). Any other license needs a review first.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
# The list states the policy, so not every license on it has to be in use.
unused-allowed-license = "allow"
confidence-threshold = 0.93
# The Desk crates are not published, and REUSE checks their licenses.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between the Desk crates have no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

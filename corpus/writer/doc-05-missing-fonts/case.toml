title = "Missing fonts"
rows = ["DOC-05"]
description = "A paragraph in each Mac font that has a free substitute with the same metrics. In Pages they are the original fonts; in Desk, the substitutes."
# The lines break where they do in Pages, but TeX Gyre Pagella kerns other
# pairs than the Palatino of the Mac, which moves a word up to 1.63 pt.
position_tolerance = 2.0

[defaults]
size = 12
space_after = 12

[[paragraphs]]
filler = 40
font = "Helvetica"

[[paragraphs]]
filler = 40
font = "Times"

[[paragraphs]]
filler = 40
font = "Courier"

[[paragraphs]]
filler = 40
font = "Arial"

[[paragraphs]]
filler = 40
font = "Times New Roman"

[[paragraphs]]
filler = 40
font = "Courier New"

[[paragraphs]]
filler = 40
font = "Palatino"

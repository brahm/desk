title = "Space before and after the paragraph"
rows = ["FMT-15"]
description = "Between two paragraphs the larger of the two spaces counts. The space before the first paragraph of the page is ignored."

[defaults]
font = "Liberation Serif"
size = 12

[[paragraphs]]
filler = 30
space_before = 36

[[paragraphs]]
filler = 30
space_after = 24

[[paragraphs]]
filler = 30
space_before = 6

[[paragraphs]]
filler = 30
space_before = 30

[[paragraphs]]
filler = 30

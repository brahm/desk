title = "Horizontal alignment"
rows = ["FMT-12"]
description = "The same text aligned left, centered, right and justified. The last line of the justified one stays on the left."

[defaults]
font = "Liberation Serif"
size = 12
space_after = 12

[[paragraphs]]
filler = 60
align = "left"

[[paragraphs]]
filler = 60
align = "center"

[[paragraphs]]
filler = 60
align = "right"

[[paragraphs]]
filler = 60
align = "justify"

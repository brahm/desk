title = "Text flows from page to page"
rows = ["INT-02", "EST-03"]
description = "Two pages of running text in the blank template, with one inch margins."

[defaults]
font = "Liberation Serif"
size = 12

[[paragraphs]]
filler = 140
repeat = 8
space_after = 6
# As in Pages by default: the first line of the fifth paragraph alone
# would end the first page, so the paragraph begins the second.
widow_control = true

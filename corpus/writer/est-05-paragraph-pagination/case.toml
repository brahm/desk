title = "Paragraph pagination"
rows = ["EST-05"]
description = "A heading kept with the next paragraph, a paragraph with its lines kept together, and widow and orphan control, each at the turn of a page."

[defaults]
font = "Liberation Serif"
size = 12
space_after = 6

# Enche a primeira página até quase o fim.
[[paragraphs]]
filler = 560

[[paragraphs]]
text = "Título mantido com o seguinte"
size = 16
bold = true
keep_with_next = true

[[paragraphs]]
filler = 80
keep_lines_together = true

[[paragraphs]]
filler = 470

[[paragraphs]]
filler = 90
widow_control = true

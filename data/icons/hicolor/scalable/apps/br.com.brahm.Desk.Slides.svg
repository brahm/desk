<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="body" x1="36" y1="0" x2="92" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#62a0ea"/>
      <stop offset="0.35" stop-color="#3584e4"/>
      <stop offset="1" stop-color="#1a5fb4"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="32" x2="0" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c3dbf8"/>
      <stop offset="1" stop-color="#62a0ea"/>
    </linearGradient>
    <linearGradient id="lip" x1="0" y1="50" x2="0" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3584e4"/>
      <stop offset="1" stop-color="#1c71d8"/>
    </linearGradient>
    <linearGradient id="mic" x1="0" y1="8" x2="0" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5e5c64"/>
      <stop offset="1" stop-color="#241f31"/>
    </linearGradient>
  </defs>
  <!-- Base -->
  <rect x="28" y="106" width="72" height="12" rx="3" fill="#1a5fb4"/>
  <rect x="28" y="104" width="72" height="9" rx="3" fill="#3584e4"/>
  <!-- Column -->
  <path d="M34 56 L94 56 L87 106 L41 106 Z" fill="url(#body)"/>
  <path d="M46 66 L82 66 L78 98 L50 98 Z" fill="#1c71d8" fill-opacity="0.45"/>
  <path d="M47 67 L81 67 L77.2 97 L50.8 97 Z" fill="none" stroke="#99c1f1" stroke-opacity="0.5"/>
  <!-- Emblem: a slide -->
  <rect x="52" y="73" width="24" height="17" rx="2" fill="#ffffff"/>
  <rect x="55" y="76" width="18" height="3" rx="1" fill="#3584e4"/>
  <rect x="55" y="82" width="4" height="5" rx="0.5" fill="#ff7800"/>
  <rect x="61" y="81" width="4" height="6" rx="0.5" fill="#f6d32d"/>
  <rect x="67" y="83" width="4" height="4" rx="0.5" fill="#33d17a"/>
  <!-- Microphone -->
  <path d="M95 44 C97 30 92 22 83 17" fill="none" stroke="#3d3846" stroke-width="3" stroke-linecap="round"/>
  <g transform="rotate(30 78 14)">
    <rect x="70" y="9" width="14" height="10" rx="5" fill="url(#mic)"/>
    <rect x="72" y="10.5" width="7" height="2" rx="1" fill="#ffffff" fill-opacity="0.35"/>
  </g>
  <!-- Reading desk -->
  <path d="M28 34 L100 34 L110 50 L18 50 Z" fill="url(#desk)"/>
  <rect x="17" y="49" width="94" height="10" rx="2.5" fill="#1a5fb4"/>
  <rect x="17" y="48" width="94" height="8" rx="2.5" fill="url(#lip)"/>
  <rect x="19" y="49" width="90" height="1.5" rx="0.75" fill="#ffffff" fill-opacity="0.4"/>
  <!-- Notes on the desk -->
  <path d="M46 37 L76 37 L78 47 L44 47 Z" fill="#ffffff"/>
  <path d="M49 40 H71 M49 43.5 H66" stroke="#c0bfbc" stroke-width="1.5" stroke-linecap="round"/>
  <ellipse cx="95" cy="44" rx="4" ry="1.8" fill="#3d3846"/>
</svg>
